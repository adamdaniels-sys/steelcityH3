<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Redirecting… — Steel City H3</title>
<script>
  // Attendance now lives on the event page itself (collapsible section).
  // Preserve the id and bounce there.
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    location.replace(id ? ('/admin-event.html?id=' + encodeURIComponent(id)) : '/admin-events.html');
  })();
</script>
</head>
<body>
  <p style="font-family: sans-serif; padding: 24px;">
    Taking you to the event page… <a id="fallback" href="/admin-events.html">Continue</a>
  </p>
</body>
</html>
